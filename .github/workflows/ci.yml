name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bullmq: ['', '5.40.0', '6.3.15'] # '' = the version in package.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run redis:up
      - run: until docker exec bullmq-groups-redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done
      - run: npm ci
      - run: npx tsc --noEmit
      - run: ${{ matrix.bullmq == '' && 'npm test' || format('npm run test:bullmq -- {0}', matrix.bullmq) }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run docs
      # docs/api is generated from the TSDoc comments in src but committed, so it can go
      # stale when a comment changes and nobody reruns `npm run docs`. Source links are
      # pinned to main in typedoc.json, so regenerating is deterministic.
      - name: docs/api matches src
        run: |
          if [ -n "$(git status --porcelain docs/api)" ]; then
            echo "::error::docs/api is stale. Run 'npm run docs' and commit the result."
            git status --short docs/api
            git diff -- docs/api | head -200
            exit 1
          fi
