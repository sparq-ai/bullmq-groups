name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bullmq: ['', '5.40.0', '6.3.15'] # '' = the version in package.json
    services:
      redis:
        image: redis:7-alpine
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: ${{ matrix.bullmq == '' && 'npm test' || format('npm run test:bullmq -- {0}', matrix.bullmq) }}
